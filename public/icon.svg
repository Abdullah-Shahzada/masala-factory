<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="500" height="500" x="6" y="6" rx="122" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.3"/>
  
  <!-- Factory & Flame Motif -->
  <g filter="url(#shadow)">
    <!-- Factory Silhouette Base -->
    <path d="M 120 380 L 120 270 L 180 310 L 180 270 L 240 310 L 240 230 L 392 230 L 392 380 Z" fill="#1e293b" opacity="0.85"/>
    <!-- Windows -->
    <rect x="270" y="270" width="28" height="36" rx="6" fill="#10b981" opacity="0.9"/>
    <rect x="320" y="270" width="28" height="36" rx="6" fill="#10b981" opacity="0.9"/>
    <rect x="270" y="325" width="28" height="36" rx="6" fill="#34d399" opacity="0.9"/>
    <rect x="320" y="325" width="28" height="36" rx="6" fill="#34d399" opacity="0.9"/>
    
    <!-- Central Masala Flame / Spice Spark -->
    <path d="M 256 100 C 270 160 330 200 330 270 C 330 330 285 365 256 365 C 227 365 182 330 182 270 C 182 220 220 180 240 140 C 248 124 252 110 256 100 Z" fill="url(#flame)"/>
    <path d="M 256 210 C 265 240 290 260 290 290 C 290 320 270 340 256 340 C 242 340 222 320 222 290 C 222 265 245 245 256 210 Z" fill="#fef08a"/>
  </g>
</svg>
